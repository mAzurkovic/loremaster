[package]
name = "loremaster"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
dev = []

[dependencies]
aho-corasick = "1.1.5"
clap = { version = "4.6.7", features = ["derive"] }
fastembed = { version = "7.5.0", default-features = false, features = ["ort-download-binaries-native-tls"] }
gix = { version = "0.90.0", default-features = false, features = ["sha1"] }
loremaster-agents.workspace = true
loremaster-core.workspace = true
regex = "1.13.1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.1"
tempfile.workspace = true
thiserror.workspace = true
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1.8"
tracing.workspace = true
tracing-subscriber = "0.3.23"
ureq = "3.5.0"
