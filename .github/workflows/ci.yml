name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # After rust-cache: post steps run in reverse, and rust-cache deletes files in target/ when it saves.
      - uses: actions/cache@v4
        with:
          path: target/tmp/shared-models
          key: embedding-model-${{ hashFiles('crates/loremaster/src/embed.rs') }}
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: clippy without dev tools
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: test without dev tools
        run: cargo test --locked -p loremaster --test cli
      - name: test
        run: cargo test --locked --workspace --all-features
